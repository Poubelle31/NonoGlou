name: Rappels Glouglou
 
# Déclenché toutes les heures par cron-job.org (plus fiable que le planificateur de GitHub),
# ou à la main avec le bouton "Run workflow".
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer même en dehors de 9h–21h (pour tester)"
        type: boolean
        default: false
 
permissions:
  contents: read
 
concurrency:
  group: rappels
  cancel-in-progress: false
 
jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
 
      - uses: actions/setup-node@v5
        with:
          node-version: 22
 
      - name: Installer
        working-directory: notifier
        run: npm install --no-audit --no-fund
 
      - name: Envoyer le rappel
        working-directory: notifier
        run: node send.mjs
        env:
          FORCE: ${{ inputs.test }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT: ${{ secrets.VAPID_CONTACT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
 
